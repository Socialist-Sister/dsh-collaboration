name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Guard: this project must NOT register LLM adapter routes — providers are
      # connected through the official Models "Add provider" flow, and shipping
      # adapters collides with the built-in provider catalog (DUPLICATE_DIRECTORY).
      - name: Guard: no LLM adapters shipped
        run: |
          if grep -rEl 'registerAdapter|registerConfigurableProviders' packages; then
            echo 'packages must not register LLM adapter routes' >&2
            echo 'users add providers via the official Settings > Models UI' >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm build
