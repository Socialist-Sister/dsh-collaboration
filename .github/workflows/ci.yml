name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Guard: this project must NOT register LLM adapter routes — providers are
      # connected through the official Models "Add provider" flow, and shipping
      # adapters collides with the built-in provider catalog (DUPLICATE_DIRECTORY).
      - name: 'Guard: no LLM adapters shipped'
        run: |
          if grep -rEl 'registerAdapter|registerConfigurableProviders' packages; then
            echo 'packages must not register LLM adapter routes' >&2
            echo 'users add providers via the official Settings > Models UI' >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm build

  docker-e2e:
    # Isolated e2e in Docker: a throwaway DSH instance (own DSH_HOME in the
    # container) + host-side scripts + the image-inbox paste-bridge browser
    # verification on a Linux chromium. See compose.yml / docker/e2e.Dockerfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the isolated e2e
        run: docker compose up --build --abort-on-container-exit e2e
      - name: Upload e2e artifacts (screenshots, console dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: .e2e-artifacts/
          if-no-files-found: ignore
